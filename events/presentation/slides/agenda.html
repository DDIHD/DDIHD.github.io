<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <link rel="stylesheet" href="../lib/slide.css">
  <style>
    .agenda-body { justify-content: center; padding-left: 3cqw; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="slide-inner">
      <h1 class="slide-head" data-gumdrop>Agenda</h1>

      <main class="slide-body agenda-body">
        <ul class="gd-list">
          <li data-gumdrop data-gd-size="h2" data-gd-bullet>Motivation</li>
          <li data-gumdrop data-gd-size="h2" data-gd-bullet>Design</li>
          <li data-gumdrop data-gd-size="h2" data-gd-bullet>Findings</li>
        </ul>
      </main>
    </div>
  </div>

  <script type="module">
    import { initSlide } from '../lib/slide.js'
    initSlide()
  </script>
</body>
</html>
